name: Word reports and synthetic examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic example dependencies
        run: python -m pip install -r requirements-demo.txt
      - name: Validate original Word documents without modifying them
        run: python tools/check_reports.py Supervised.docx 'Unsupervised Learning.docx'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run independent synthetic examples
        run: python -m examples.synthetic_demo all
